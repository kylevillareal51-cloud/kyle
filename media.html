<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learn badminton basics, watch the sport, and join our club.">
  <title>Media | Badminton Club</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">Badminton Club</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="basics.html">Basics</a></li>
          <li><a href="media.html" aria-current="page">Media</a></li>
          <li><a href="contact.html">Join</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Watch and listen</h1>
    <p>Hear the club intro and see how a court is laid out.</p>

    <section>
      <h2>Club intro</h2>
      <figure>
        <audio controls preload="metadata">
          <source src="media/intro.wav" type="audio/wav">
          <p>Your browser does not support audio. <a href="media/intro.wav">Download the audio file</a>.</p>
        </audio>
        <figcaption>A short intro chime for the Badminton Club. Replace it with your own recording or a video of your group playing.</figcaption>
      </figure>
    </section>

    <section>
      <h2>The court at a glance</h2>
      <figure>
        <img src="images/court.svg" alt="Top-down view of a badminton court with a net across the middle">
        <figcaption>Lines mark the singles and doubles boundaries and the service boxes.</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Badminton Club &middot; Kyle &middot; HTML5 Forms &amp; Multimedia Final Project</p>
  </footer>
</body>
</html>
