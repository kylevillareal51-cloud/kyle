<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Learn badminton basics, watch the sport, and join our club.">
  <title>Join | Badminton Club</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="index.html">Badminton Club</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="basics.html">Basics</a></li>
          <li><a href="media.html">Media</a></li>
          <li><a href="contact.html" aria-current="page">Join</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Join the club</h1>
    <p>Tell us a little about yourself and we will place you in a practice group. Fields marked <span class="required">*</span> are required.</p>

    <form action="#" method="post">
      <div class="field">
        <label for="name">Full name <span class="required">*</span></label>
        <input type="text" id="name" name="name" placeholder="Juan Dela Cruz" required>
      </div>

      <div class="field">
        <label for="email">Email address <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="you@school.edu" required>
      </div>

      <div class="field">
        <label for="level">Skill level <span class="required">*</span></label>
        <select id="level" name="level" required>
          <option value="">Choose your level</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>

      <div class="field">
        <label for="message">Anything we should know? <span class="required">*</span></label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit">Join the club</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Badminton Club &middot; Kyle &middot; HTML5 Forms &amp; Multimedia Final Project</p>
  </footer>
</body>
</html>
